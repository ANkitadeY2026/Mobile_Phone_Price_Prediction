<!DOCTYPE html>

<html>

<head>

    <title>
        Mobile Phone Price Prediction
    </title>


    <style>

        body {

            font-family: Arial;

            background: #f2f4f7;

            margin: 0;

            padding: 0;

        }


        .container {

            width: 500px;

            margin: 40px auto;

            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.1);

        }


        h1 {

            text-align: center;

            margin-bottom: 25px;

        }


        label {

            font-weight: bold;

            display: block;

            margin-top: 15px;

        }


        input,
        select {

            width: 100%;

            padding: 10px;

            margin-top: 5px;

            box-sizing: border-box;

            border: 1px solid #ccc;

            border-radius: 5px;

        }


        button {

            width: 100%;

            padding: 12px;

            margin-top: 25px;

            background: #222;

            color: white;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            font-size: 16px;

        }


        button:hover {

            background: #444;

        }


        .result {

            margin-top: 25px;

            padding: 15px;

            background: #e8f5e9;

            text-align: center;

            font-size: 20px;

            font-weight: bold;

            border-radius: 8px;

        }

    </style>

</head>


<body>


<div class="container">


    <h1>
        📱 Mobile Phone Price Prediction
    </h1>


    <form method="POST">


        <label>
            Brand
        </label>


        <select name="brand">

            <option>Samsung</option>

            <option>Apple</option>

            <option>Xiaomi</option>

            <option>Oneplus</option>

            <option>Realme</option>

            <option>Vivo</option>

            <option>Oppo</option>

        </select>



        <label>
            RAM (GB)
        </label>


        <input
            type="number"
            name="ram"
            value="8"
            required
        >



        <label>
            Storage (GB)
        </label>


        <input
            type="number"
            name="storage"
            value="128"
            required
        >



        <label>
            Camera (MP)
        </label>


        <input
            type="number"
            name="camera"
            value="50"
            required
        >



        <label>
            Battery (mAh)
        </label>


        <input
            type="number"
            name="battery"
            value="5000"
            required
        >



        <label>
            Screen Size (inch)
        </label>


        <input
            type="number"
            step="0.1"
            name="screen"
            value="6.5"
            required
        >



        <button type="submit">

            Predict Phone Price

        </button>


    </form>



    {% if prediction is not none %}

    <div class="result">

        Predicted Price:
        ₹{{ prediction }}

    </div>

    {% endif %}


</div>


</body>

</html>
